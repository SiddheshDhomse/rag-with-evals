# =====================================================================
# RAG Evaluation Suite - Configuration Specification
# =====================================================================

system:
  project_name: "RAG Evaluation Suite"
  default_llm_provider: "groq"
  default_embedding_provider: "huggingface"

providers:
  groq:
    default_model: "qwen/qwen3.8-27b"
    alternatives:
      - "qwen/qwen-2.5-32b"
      - "llama-3.1-8b-instant"
    temperature: 0.2
    max_tokens: 450

  nvidia:
    default_model: "meta/llama-3.2-11b-vision-instruct"
    endpoint: "https://integrate.api.nvidia.com/v1"
    temperature: 0.2

  openrouter:
    default_model: "openrouter/free"
    endpoint: "https://openrouter.ai/api/v1"
    temperature: 0.2

  ollama:
    default_model: "llama3.1:8b"
    base_url: "http://localhost:11434"
    temperature: 0.2

embeddings:
  huggingface:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    dimension: 384
  ollama:
    model_name: "nomic-embed-text"
    dimension: 768
  nvidia:
    model_name: "nvidia/llama-3.2-nv-embedqa-1b-v1"

vectorstore:
  collection_name: "rag_knowledge_base"
  distance_function: "cosine"
  chunk_size: 800
  chunk_overlap: 150
  top_k: 4

hybrid_search:
  bm25_weight: 0.5
  dense_weight: 0.5
  rrf_c: 60

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  candidates_k: 15
  top_k: 4

query_transformation:
  default_mode: "none"
  multi_query_count: 3
  hyde_max_tokens: 180
  supported_modes:
    - "none"
    - "multi_query"
    - "hyde"
    - "step_back"
    - "adaptive"

evaluation:
  benchmark_dataset: "data/testsets/amnesty_qa_eval.json"
  sample_count: 20
  metrics:
    - "context_recall"
    - "context_precision"
    - "faithfulness"
    - "answer_relevance"
